name: CI

on:
  # Runs on push to main/master/develop — feature/* is handled by deploy-dev.yml
  push:
    branches: [ main, master, develop ]
  # Runs on PRs targeting any branch (code review gate)
  pull_request:
    branches: [ main, master, develop, 'feature/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test -- --runInBand --coverage

      - name: Publish coverage summary
        if: success()
        run: |
          node <<'NODE_SCRIPT'
          const fs = require('fs');
          const path = 'coverage/coverage-summary.json';
          if (!fs.existsSync(path)) {
            console.warn('coverage-summary.json not found');
            process.exit(0);
          }

          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const total = data.total || {};
          const fmt = (t) => (t ? `${t.pct}% ( ${t.covered}/${t.total} )` : 'n/a');

          const lines = [
            '## Jest coverage summary',
            '| Metric | Coverage |',
            '| --- | --- |',
            `| Statements | ${fmt(total.statements)} |`,
            `| Branches | ${fmt(total.branches)} |`,
            `| Functions | ${fmt(total.functions)} |`,
            `| Lines | ${fmt(total.lines)} |`,
          ];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE_SCRIPT

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
