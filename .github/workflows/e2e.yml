name: E2E Tests

# Runs on every push/PR to feature/* branches.
on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - 'feature/**'

jobs:
  cypress-e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node + npm cache ────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # ── 3. Cypress binary cache ────────────────────────────────────────────
      #   The binary lives in ~/.cache/Cypress and is ~700 MB.
      #   Caching it avoids re-downloading on every run (biggest time saver).
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-bin-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cypress-bin-${{ runner.os }}-

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Run Cypress ─────────────────────────────────────────────────────
      #   install: false  → skip the second npm install inside the action
      #   (we already ran npm ci above, binary is cached)
      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 60
          browser: chrome
          headless: true
          command: npm run test:e2e:ci
        env:
          VITE_AUTH_BASE_URL: https://apitravelhub.site
          VITE_SEARCH_BASE_URL: https://apitravelhub.site
          VITE_BOOKING_BASE_URL: https://apitravelhub.site
          VITE_ENV_NAME: ci

      # ── 6. Upload artifacts on failure ─────────────────────────────────────
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
