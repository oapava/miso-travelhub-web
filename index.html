<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TravelHub - Your travel companion for B2C and B2B solutions" />
    <title>TravelHub</title>
    <!--
      env-config.js is generated at container start by docker-entrypoint.sh.
      It populates window.__ENV__ with runtime values from Cloud Run env vars.
      In local dev, public/env-config.js is an empty placeholder (no-op).
    -->
    <script src="/env-config.js"></script>
  </head>
  <body>
    <!--
      Skip link — WCAG 2.4.1 Bypass Blocks (Level A).
      Visible only on :focus; allows keyboard/screen-reader users to jump
      directly to the main content, bypassing the header and nav.
    -->
    <a href="#main-content" class="skip-to-content">Saltar al contenido principal</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
